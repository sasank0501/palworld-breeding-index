<!doctype html>
<meta charset="utf-8" />
<title>CUE4Parse spike</title>
<pre id="out">starting worker…</pre>
<script type="module">
  const out = document.getElementById('out');
  const w = new Worker('./main.js', { type: 'module' });
  w.onmessage = (e) => { out.textContent = JSON.stringify(e.data, null, 2); window.spikeResult = e.data; };
  w.onerror = (e) => { out.textContent = 'worker error: ' + e.message; window.spikeResult = { error: e.message }; };
</script>
