<!doctype html>
<!--
  Render target for scripts/render-portraits.mjs. Served by the Vite dev server
  (so /pal-models/ is same-origin) and driven over CDP; not part of the app.
  The logic lives in portrait-harness.js (see the note there on why).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; background: transparent; }
      model-viewer { width: 768px; height: 768px; background: transparent; --poster-color: transparent; }
    </style>
    <script type="module" src="/node_modules/@google/model-viewer/dist/model-viewer.min.js"></script>
  </head>
  <body>
    <model-viewer id="mv" interaction-prompt="none" shadow-intensity="0" exposure="0.85" tone-mapping="aces"></model-viewer>
  </body>
</html>
